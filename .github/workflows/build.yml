name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          VC=$((100 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VC" >> $GITHUB_ENV
          echo "VERSION_NAME=1.1.${{ github.run_number }}" >> $GITHUB_ENV
          gradle --no-daemon --stacktrace -PversionCode=$VC -PversionName=1.1.${{ github.run_number }} assembleRelease 2>&1 | tee ../gradle.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 gradle.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done || true
          tail -40 gradle.log | while IFS= read -r line; do echo "::warning::$line"; done || true

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/esp32dth-widgety.apk
          NOTES=$(git log -1 --pretty=%s | head -c 300)
          python3 - "$NOTES" <<'PY'
          import json, os, sys
          json.dump({
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apk": "https://github.com/${{ github.repository }}/releases/download/v" + os.environ["VERSION_NAME"] + "/esp32dth-widgety.apk",
              "notes": sys.argv[1],
          }, open("out/version.json", "w"), ensure_ascii=False)
          PY
          cat out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: esp32dth-widgety-apk
          path: out/*

      - name: Publish release "latest"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: DHT Widgety ${{ env.VERSION_NAME }}
          body: |
            Automaticky zostavená Android aplikácia s 10 widgetmi.
            Stiahni **esp32dth-widgety.apk** a nainštaluj do telefónu (povoľ inštaláciu z neznámych zdrojov).
          prerelease: false
          make_latest: true
          files: |
            out/esp32dth-widgety.apk
            out/version.json

  esp32:
    name: ESP32 firmvér
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
          sketch-paths: |
            - esp32/esp32_dht_station

  web:
    name: PHP kontrola
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint
        run: find web -name '*.php' -print0 | xargs -0 -n1 php -l
